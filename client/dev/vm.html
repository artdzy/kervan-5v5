<!doctype html>
<html><head><meta charset="utf-8"><title>VM Test</title>
<style>body{margin:0;background:#6a7a8a;overflow:hidden;color:#fff;font:12px monospace} #i{position:fixed;left:4px;top:4px;background:#0008;padding:3px} #x{position:fixed;left:50%;top:50%;width:6px;height:6px;margin:-3px;background:#0f0}</style>
<script type="importmap">{ "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/examples/jsm/" } }</script>
</head><body><div id="i"></div><div id="x"></div>
<script type="module">
// Kullanım: vm.html?m=pistol&t=6.0  (t: klipte saniye)  ya da &a=fire  (config klibi)
import * as THREE from 'three';
import { ViewModel } from '/js/viewmodel.js';
const q = new URLSearchParams(location.search);
const r = new THREE.WebGLRenderer({ antialias: true });
r.setSize(innerWidth, innerHeight); r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.ACESFilmicToneMapping; r.autoClear = false;
document.body.append(r.domElement);
const vm = new ViewModel(innerWidth / innerHeight, r);
if (q.get('cfg')) vm.overrideConfig = JSON.parse(q.get('cfg'));
await vm.loadModels();
vm.setWeapon(q.get('m') || 'pistol', true);
const m = vm.cur;
let info = `${q.get('m')} gltf=${!!m.gltf} anims=${(m.anims || []).map((a) => a.name + ':' + a.duration.toFixed(2)).join(',')}`;
if (m.gltf && q.get('t')) { vm.freezeAt(Number(q.get('t'))); }
if (m.gltf && q.get('a')) { vm.play(q.get('a')); }
document.getElementById('i').textContent = info;
let last = performance.now();
function loop() {
  requestAnimationFrame(loop);
  const now = performance.now(); const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!q.get('t')) vm.update(dt, { speed: 0, onGround: true, scoped: false });
  r.clear(); vm.render(r);
}
loop();
</script></body></html>
